project_name: "jobhunt"
default_status: "To Do"
statuses: ["On Hold","To Do", "In Progress", "Done", "Won't Do"]
labels: []
definition_of_done: []
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vim"
auto_open_browser: true
default_port: 6421
remote_operations: true
auto_commit: true
filesystem_only: false
zero_padded_ids: 3
bypass_git_hooks: true
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
