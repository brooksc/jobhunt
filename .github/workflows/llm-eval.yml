name: LLM Eval

# Manual trigger or weekly schedule (Sunday 02:00 UTC).
# Requires repository secrets: JOBHUNT_LLM_URL, JOBHUNT_LLM_API_KEY.
# Set JOBHUNT_LLM_MIN_ACCURACY (default 75) to fail below that threshold.
on:
  workflow_dispatch:
    inputs:
      min_accuracy:
        description: 'Minimum accuracy % to pass (default 75)'
        required: false
        default: '75'
      llm_model:
        description: 'Model override (leave blank to use provider default)'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  llm-eval:
    runs-on: macos-latest
    # mise resolves tool versions via the GitHub API; without auth it hits the 60/hr
    # unauthenticated limit on the shared runner IP and `mise install` fails with 403
    # (Tuist/SwiftLint/SwiftFormat downloads). The auto-provided token raises this to 1000/hr.
    # Same fix as swift-build.yml — this scheduled job kept failing at setup without it.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # TASK-410: install mise first (a fresh runner has no mise), then install the pinned
      # toolchain from .mise.toml — same setup as swift-build.yml.
      - name: Install mise
        run: curl -Ls https://mise.run | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pinned tools (Tuist via .mise.toml)
        run: mise install

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Run LLM Eval
        env:
          JOBHUNT_LLM_URL: ${{ secrets.JOBHUNT_LLM_URL }}
          JOBHUNT_LLM_API_KEY: ${{ secrets.JOBHUNT_LLM_API_KEY }}
          JOBHUNT_LLM_MIN_ACCURACY: ${{ github.event.inputs.min_accuracy || '75' }}
          JOBHUNT_LLM_MODEL: ${{ github.event.inputs.llm_model || '' }}
        run: |
          xcodebuild test \
            -scheme Jobhunt-Eval \
            -destination 'platform=macOS' \
            -only-testing LLMEval \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload eval results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: llm-eval-results-${{ github.run_id }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 30
          if-no-files-found: ignore
