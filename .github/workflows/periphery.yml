name: Dead-code scan

# Weekly rather than per-push. Periphery drives its own full xcodebuild, so adding it to swift-build
# would roughly double the only macOS job that runs on every push — for a class of problem that
# accrues over weeks, not within a single PR. Manual dispatch is there for when a large deletion
# wants checking immediately.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install mise
        run: |
          curl -fsSL -o /tmp/mise-install.sh https://github.com/jdx/mise/releases/download/v2026.5.3/install.sh
          echo "76168cc525fc3b209638e88b4c6b707420438a6b7cc428bd468ae08afad432c1  /tmp/mise-install.sh" | shasum -a 256 -c -
          MISE_VERSION=v2026.5.3 sh /tmp/mise-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools (Tuist, SwiftLint, SwiftFormat)
        run: mise install && mise reshim

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      # A ratchet, not a zero-findings gate — see the script header and .periphery.yml.
      - name: Dead-code ratchet
        run: ./scripts/check-periphery.sh --list
