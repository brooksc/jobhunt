name: Release DMG

# Test gate (tag release — DMG):
#   CoreTests + ServerTests + MCPTests  — same fast suite as PR gate; confirms no regression at release time
#   Extension Node tests               — validates capture.js version wiring before the zip is packaged
#   AppUITests: excluded               — requires a display server / running app; run manually pre-tag
#   LLMEval: excluded                  — opt-in only; run locally with a real LLM provider before tagging
#
# Required secrets (configure in repo Settings > Secrets > Actions):
#
# DEVELOPER_ID_CERT_BASE64       — "Developer ID Application" cert exported as .p12, then: base64 -i cert.p12
# DEVELOPER_ID_CERT_PASSWORD     — Password set when exporting the .p12
# MAS_CERT_BASE64                — "3rd Party Mac Developer Application" cert as base64-encoded .p12
# MAS_CERT_PASSWORD              — Password for MAS Application .p12
# MAS_INSTALLER_CERT_BASE64      — "3rd Party Mac Developer Installer" cert as base64-encoded .p12
# MAS_INSTALLER_CERT_PASSWORD    — Password for MAS Installer .p12
# APPLE_ID                       — Apple ID email
# APPLE_APP_SPECIFIC_PASSWORD    — App-specific password from appleid.apple.com → App-Specific Passwords
# APPLE_TEAM_ID                  — 10-character team ID from developer.apple.com/account
# GITHUB_TOKEN                   — Provided automatically by Actions (no configuration needed)

on:
  push:
    tags: ['v*']

jobs:
  build-dmg:
    runs-on: macos-latest
    env:
      DEVELOPER_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Import Developer ID certificate
        run: |
          echo "${{ secrets.DEVELOPER_ID_CERT_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Install Tuist (pinned via .mise.toml)
        run: mise install tuist

      # tuist install is skipped: Tuist.swift declares an empty Config() with no external
      # Swift Package dependencies, so there is nothing to fetch.

      - name: Generate project
        run: tuist generate --no-open

      - name: Run extension Node tests
        run: npm test --prefix extension

      - name: Run Swift tests (Core + Server + MCP)
        run: |
          nice xcodebuild test \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            -only-testing CoreTests \
            -only-testing ServerTests \
            -only-testing MCPTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          nice xcodebuild archive \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-DMG \
            -configuration Release-DMG \
            -archivePath build/Jobhunt-DMG.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export archive (Developer ID)
        run: |
          cat > export-options-dmg.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Jobhunt-DMG.xcarchive \
            -exportPath build/export-dmg \
            -exportOptionsPlist export-options-dmg.plist

      # Smoke checks: confirm the exported .app exists and is properly signed before packaging.
      # These catch export failures (missing .app) and signing issues (invalid signature,
      # wrong identity) that would otherwise produce a broken DMG distributed to users.
      - name: Smoke check exported app
        run: |
          test -d build/export-dmg/Jobhunt.app
          codesign -v build/export-dmg/Jobhunt.app
          echo "App exists and signature is valid."

      # Verify Hardened Runtime is enabled on the signed app before packaging.
      # To verify locally after an archive build:
      #   codesign -dv --verbose=4 build/export-dmg/Jobhunt.app 2>&1 | grep -i runtime
      # Expected output: flags=0x10000(runtime)  — the "runtime" flag confirms Hardened Runtime is active.
      - name: Verify Hardened Runtime
        run: |
          codesign -dv --verbose=4 build/export-dmg/Jobhunt.app 2>&1 | grep -i runtime
          echo "Hardened Runtime verified."

      - name: Create DMG
        run: |
          # Stage the .app alongside an /Applications symlink so users get the standard
          # "drag to Applications" install experience when they open the DMG.
          mkdir -p build/dmg-staging
          cp -R build/export-dmg/Jobhunt.app build/dmg-staging/Jobhunt.app
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create -volname Jobhunt \
            -srcfolder build/dmg-staging \
            -ov -format UDZO \
            build/Jobhunt-${{ github.ref_name }}.dmg

      # Smoke check the DMG: verify it is a valid disk image and that the .app is present inside.
      # This catches corruption or hdiutil packaging errors before notarization.
      - name: Smoke check DMG
        run: |
          hdiutil verify build/Jobhunt-${{ github.ref_name }}.dmg
          MOUNT=$(hdiutil attach -nobrowse -noautoopen build/Jobhunt-${{ github.ref_name }}.dmg | awk '/\/Volumes/{print $NF}')
          test -d "$MOUNT/Jobhunt.app"
          hdiutil detach "$MOUNT"
          echo "DMG mounts and contains Jobhunt.app."

      - name: Notarize
        run: |
          xcrun notarytool submit build/Jobhunt-${{ github.ref_name }}.dmg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple build/Jobhunt-${{ github.ref_name }}.dmg

      # Package the Chrome extension and attach it to the release.
      # Upload to the Chrome Web Store manually after validating the release build:
      #   https://chrome.google.com/webstore/devconsole → Jobhunt Capture → Package → Upload new package
      # The extension version in extension/manifest.json must be bumped in the same commit as MARKETING_VERSION.
      - name: Package Chrome extension
        run: ./scripts/package-extension.sh

      - name: Upload to GitHub Release
        # softprops/action-gh-release@v2.6.2
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            build/Jobhunt-${{ github.ref_name }}.dmg
            chromestore/jobhunt-capture-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
