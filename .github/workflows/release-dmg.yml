name: Release DMG

on:
  push:
    tags: ['v*']

# TASK-353: least-privilege permissions — job-level write only for the release job
permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write   # required to upload release artifacts
      id-token: write   # required for OIDC/attestation (TASK-351 provenance)
    env:
      DEVELOPER_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          APP_VERSION=$(grep 'MARKETING_VERSION' Project.swift | head -1 | sed 's/.*"\(.*\)".*/\1/')
          EXT_VERSION=$(python3 -c "import json,sys; d=json.load(open('extension/manifest.json')); print(d['version'])")

          echo "Tag: $TAG_VERSION, App: $APP_VERSION, Extension: $EXT_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match app version $APP_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match extension version $EXT_VERSION"
            exit 1
          fi
          echo "All versions match: $TAG_VERSION"

      - name: Import Developer ID certificate
        run: |
          echo "${{ secrets.DEVELOPER_ID_CERT_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Install Tuist
        run: curl -Ls https://install.tuist.io | bash

      - name: Install dependencies
        run: tuist install || true

      - name: Generate project
        run: tuist generate --no-open

      - name: Run tests
        run: nice xcodebuild test -project Jobhunt.xcodeproj -scheme Jobhunt-DMG -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO

      - name: Archive
        run: |
          nice xcodebuild archive \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-DMG \
            -configuration Release-DMG \
            -archivePath build/Jobhunt-DMG.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export archive (Developer ID)
        run: |
          cat > export-options-dmg.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Jobhunt-DMG.xcarchive \
            -exportPath build/export-dmg \
            -exportOptionsPlist export-options-dmg.plist

      - name: Smoke check DMG contents
        run: |
          APP_PATH="build/export-dmg/Jobhunt.app"
          HELPER="$APP_PATH/Contents/Helpers/jobhunt-mcp"

          # Check app exists and is signed
          test -d "$APP_PATH" || { echo "ERROR: Jobhunt.app missing from export"; exit 1; }
          codesign --verify --verbose "$APP_PATH" || { echo "ERROR: Jobhunt.app not signed"; exit 1; }

          # Check MCP helper exists, is executable, and is signed
          test -f "$HELPER" || { echo "ERROR: MCP helper missing at $HELPER"; exit 1; }
          test -x "$HELPER" || { echo "ERROR: MCP helper not executable"; exit 1; }
          codesign --verify --verbose "$HELPER" || { echo "ERROR: MCP helper not signed"; exit 1; }

          echo "DMG smoke check passed"

      - name: Create DMG
        run: |
          hdiutil create -volname Jobhunt \
            -srcfolder build/export-dmg/Jobhunt.app \
            -ov -format UDZO \
            build/Jobhunt-${{ github.ref_name }}.dmg

      - name: Notarize
        run: |
          xcrun notarytool submit build/Jobhunt-${{ github.ref_name }}.dmg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple build/Jobhunt-${{ github.ref_name }}.dmg

      # TASK-356: Clean up signing certificate material before upload steps
      - name: Clean up signing certificate
        if: always()
        run: |
          # Remove decoded p12 file from working directory
          rm -f cert.p12
          # Lock and delete temporary keychain
          security lock-keychain build.keychain 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true
          echo "Signing material cleaned up"

      # TASK-351: Generate SHA256 checksums for release artifacts
      - name: Generate checksums
        run: |
          shasum -a 256 build/Jobhunt-${{ github.ref_name }}.dmg > build/Jobhunt-${{ github.ref_name }}.dmg.sha256
          cat build/Jobhunt-${{ github.ref_name }}.dmg.sha256

      # TASK-351: Record build provenance
      - name: Record provenance
        run: |
          echo "Build provenance:" > provenance.txt
          echo "  Runner: $RUNNER_OS" >> provenance.txt
          echo "  Commit: ${{ github.sha }}" >> provenance.txt
          echo "  Tag: ${{ github.ref_name }}" >> provenance.txt
          echo "  Workflow: ${{ github.workflow }}" >> provenance.txt
          cat provenance.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Jobhunt-${{ github.ref_name }}.dmg
            build/Jobhunt-${{ github.ref_name }}.dmg.sha256
            provenance.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
