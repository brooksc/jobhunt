name: Release DMG

on:
  push:
    tags: ['v*']

# TASK-353: least-privilege permissions — job-level write only for the release job
permissions:
  contents: read

jobs:
  build-dmg:
    runs-on: macos-latest
    permissions:
      contents: write   # required to upload release artifacts
      id-token: write   # required for OIDC/attestation (TASK-351 provenance)
    env:
      DEVELOPER_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      # Authenticates mise's GitHub API calls (tool downloads) → 1000/hr instead of the
      # unauthenticated 60/hr per-IP limit, which otherwise fails 'mise install' (matches swift-build.yml).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Verify version consistency
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          # Extract the Tuist .marketingVersion("x.y.z") value — NOT the Info.plist
          # "$(MARKETING_VERSION)" placeholder. Must match version-parity.yml's parser.
          APP_VERSION=$(grep -o '\.marketingVersion("[0-9.]*")' Project.swift | grep -o '"[0-9.]*"' | tr -d '"')
          EXT_VERSION=$(python3 -c "import json,sys; d=json.load(open('extension/manifest.json')); print(d['version'])")

          echo "Tag: $TAG_VERSION, App: $APP_VERSION, Extension: $EXT_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match app version $APP_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match extension version $EXT_VERSION"
            exit 1
          fi
          echo "All versions match: $TAG_VERSION"

      # TASK-399: use the same pinned toolchain as normal CI (.mise.toml: Tuist 4.196.1)
      # instead of curl-installing latest Tuist. mise install fails the job on error
      # (no `|| true` masking).
      - name: Install mise
        run: |
          curl -Ls https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Expose tool shims (tuist) to later steps, not just the mise binary (matches swift-build.yml).
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools (Tuist via .mise.toml)
        run: mise install && mise reshim

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Run fast-gate tests (Core + Server + MCP)
        # Only the fast gate here — the Jobhunt-DMG scheme's test action also includes AppUITests
        # (heavy XCUITest suite needing a graphical session + accessibility/screen-recording perms),
        # which has no place in the release path. AppUITests run separately (ui-tests.yml). The
        # tagged commit already passed the full fast gate in swift-build.yml.
        run: |
          nice xcodebuild test \
            -project Jobhunt.xcodeproj -scheme Jobhunt-DMG \
            -destination 'platform=macOS' \
            -only-testing:CoreTests -only-testing:ServerTests -only-testing:MCPTests \
            CODE_SIGNING_ALLOWED=NO

      # Import AFTER tests: `security list-keychains -s build.keychain` replaces the keychain search
      # list, which breaks the SettingsStore Keychain round-trip unit tests if they run afterward.
      # Archive (signing) is the first step that actually needs the identity.
      - name: Import Developer ID certificate
        run: |
          echo "${{ secrets.DEVELOPER_ID_CERT_BASE64 }}" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      # TASK-571: derive a monotonic CFBundleVersion per release instead of the fixed constant in
      # Project.swift. Sparkle compares CFBundleVersion to decide "is there an update?"; a UTC
      # YYYYMMDDHHMM timestamp is always greater than the previous release's, so updates are detected
      # automatically with no manual bump. (DMG channel only — the App Store enforces its own
      # monotonicity and needs a uint32-sized build number, so MAS will get its own scheme.)
      - name: Compute build number + guard monotonicity
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "New CFBundleVersion: $BUILD_NUMBER"
          # Belt-and-suspenders: fail if it isn't strictly greater than the currently published one
          # (read from the latest release's appcast — sparkle:version IS the CFBundleVersion).
          PREV=$(curl -fsSL "https://github.com/brooksc/jobhunt/releases/latest/download/appcast.xml" 2>/dev/null \
            | grep -oE 'sparkle:version="[0-9]+"' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$PREV" ] && [ "$BUILD_NUMBER" -le "$PREV" ]; then
            echo "ERROR: build number $BUILD_NUMBER is not greater than the published $PREV (Sparkle would not detect the update)." >&2
            exit 1
          fi
          echo "OK: $BUILD_NUMBER > ${PREV:-<no prior release>}"

      - name: Archive
        run: |
          # Project.swift's sharedBase uses automaticCodeSigning; Developer ID distribution needs
          # MANUAL signing. Passing CODE_SIGN_IDENTITY alone leaves the style as Automatic and Xcode
          # errors with "conflicting provisioning settings", so force CODE_SIGN_STYLE=Manual here.
          # Developer ID apps need no provisioning profile, so clear the specifier too.
          nice xcodebuild archive \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-DMG \
            -configuration Release-DMG \
            -archivePath build/Jobhunt-DMG.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      # Take the already-signed app straight from the archive instead of `xcodebuild -exportArchive`.
      # exportArchive's IDEDistribution throws "Unknown Distribution Error" for manually-signed
      # Developer ID archives on the runner's Xcode 16.4. The archive's app is already signed with
      # the Developer ID identity + hardened runtime (the MCP helper is copied before Xcode's CodeSign
      # phase, and Sparkle is embedded+signed), so for Developer ID distribution a copy is equivalent
      # — exportArchive would not re-sign it with a different cert. ditto preserves the bundle's
      # signature exactly. The smoke check below verifies the signature before notarization.
      - name: Export app from archive (Developer ID)
        run: |
          APP_SRC="build/Jobhunt-DMG.xcarchive/Products/Applications/Jobhunt.app"
          test -d "$APP_SRC" || { echo "ERROR: Jobhunt.app missing from archive at $APP_SRC"; exit 1; }
          mkdir -p build/export-dmg
          ditto "$APP_SRC" build/export-dmg/Jobhunt.app

      # Xcode's archive signing does NOT recurse into Sparkle's nested helpers (Updater.app and
      # Autoupdate), so they keep Sparkle's upstream signature — no Developer ID, no secure timestamp
      # — and notarization rejects them (TASK-566). Re-sign Sparkle's nested code inside-out with the
      # Developer ID identity + hardened runtime + a secure timestamp (preserving each component's
      # entitlements), then re-seal the framework and the app over the new hashes.
      - name: Re-sign Sparkle nested code for notarization
        run: |
          set -euo pipefail
          APP="build/export-dmg/Jobhunt.app"
          SP="$APP/Contents/Frameworks/Sparkle.framework"
          SPV="$SP/Versions/Current"
          sign() {
            codesign --force --options runtime --timestamp --preserve-metadata=entitlements \
              --sign "Developer ID Application" "$@"
          }
          sign "$SPV/Updater.app/Contents/MacOS/Updater"
          sign "$SPV/Updater.app"
          sign "$SPV/Autoupdate"
          sign "$SPV/XPCServices/Downloader.xpc"
          sign "$SPV/XPCServices/Installer.xpc"
          sign "$SP"
          sign "$APP/Contents/Helpers/jobhunt-mcp"
          sign "$APP"
          # Catch any remaining nested-signing gap here instead of as an opaque notarization failure.
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Smoke check DMG contents
        run: |
          APP_PATH="build/export-dmg/Jobhunt.app"
          HELPER="$APP_PATH/Contents/Helpers/jobhunt-mcp"

          # Check app exists and is signed
          test -d "$APP_PATH" || { echo "ERROR: Jobhunt.app missing from export"; exit 1; }
          codesign --verify --verbose "$APP_PATH" || { echo "ERROR: Jobhunt.app not signed"; exit 1; }

          # Check MCP helper exists, is executable, and is signed
          test -f "$HELPER" || { echo "ERROR: MCP helper missing at $HELPER"; exit 1; }
          test -x "$HELPER" || { echo "ERROR: MCP helper not executable"; exit 1; }
          codesign --verify --verbose "$HELPER" || { echo "ERROR: MCP helper not signed"; exit 1; }

          # TASK-566: Sparkle auto-updater must be embedded and signed (notarization rejects
          # unsigned nested code, and a missing framework crashes the app at launch).
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          test -d "$SPARKLE" || { echo "ERROR: Sparkle.framework missing from DMG export"; exit 1; }
          codesign --verify --verbose "$SPARKLE" || { echo "ERROR: Sparkle.framework not signed"; exit 1; }

          # TASK-401: assert the hardened runtime is enabled BEFORE notarization — Developer ID apps
          # without it are rejected by notarytool, and catching it here gives a clear error instead
          # of a late, opaque notarization failure. `codesign -dvv` prints `flags=0x10000(runtime)`.
          for target in "$APP_PATH" "$HELPER"; do
            if codesign -dvv "$target" 2>&1 | grep -q 'flags=.*runtime'; then
              echo "✓ hardened runtime enabled: $target"
            else
              echo "ERROR: hardened runtime NOT enabled on $target (notarization would fail)." >&2
              codesign -dvv "$target" 2>&1 | grep -i 'flags' >&2 || true
              exit 1
            fi
          done

          echo "DMG smoke check passed"

      - name: Create DMG (styled, with Applications drop-link)
        run: |
          set -euo pipefail
          # Multi-resolution background (1x + 2x) → crisp on Retina, fills the window on standard
          # displays. tiffutil ships with macOS.
          tiffutil -cathidpicheck config/dmg/background.png config/dmg/background@2x.png \
            -out build/dmg-background.tiff
          # dmgbuild writes the .DS_Store icon layout DIRECTLY (no Finder/AppleScript), so it works on
          # the headless runner — create-dmg's AppleScript path fails here with
          # "-1743 Not authorized to send Apple events to Finder". Pinned for reproducibility.
          python3 -m venv build/dmgvenv
          build/dmgvenv/bin/pip install --quiet dmgbuild==1.6.7
          DMG_APP="build/export-dmg/Jobhunt.app" \
          DMG_BACKGROUND="build/dmg-background.tiff" \
            build/dmgvenv/bin/dmgbuild -s config/dmg/dmg-settings.py \
              "JobHunt" "build/Jobhunt-${{ github.ref_name }}.dmg"
          test -f "build/Jobhunt-${{ github.ref_name }}.dmg" \
            || { echo "ERROR: DMG not created"; exit 1; }

      - name: Notarize
        run: |
          DMG="build/Jobhunt-${{ github.ref_name }}.dmg"
          # TASK-401: capture the submission output so that on failure we can fetch the detailed
          # notarization log (the reason is otherwise buried in Apple's portal, not the CI logs).
          # NOTE: `notarytool submit --wait` exits 0 even when the result is Invalid, so detect the
          # outcome from the printed status (not the exit code) — otherwise an Invalid submission
          # silently falls through to `stapler staple`, which then fails opaquely with Error 65.
          SUBMIT_OUTPUT=$(xcrun notarytool submit "$DMG" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait 2>&1) || true
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep -Eo 'id: [0-9a-f-]+' | head -1 | awk '{print $2}')
          STATUS=$(echo "$SUBMIT_OUTPUT" | awk -F': *' '/status:/{s=$2} END{print s}')
          echo "Notarization status: ${STATUS:-unknown} (submission ${SUBMISSION_ID:-none})"
          if [ "$STATUS" != "Accepted" ]; then
            if [ -n "$SUBMISSION_ID" ]; then
              echo "--- notarization log ($SUBMISSION_ID) ---"
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "${{ secrets.APPLE_ID }}" \
                --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
                --team-id "${{ secrets.APPLE_TEAM_ID }}" || true
            fi
            echo "ERROR: notarization not Accepted (status=${STATUS:-unknown}); see log above." >&2
            exit 1
          fi
          xcrun stapler staple "$DMG"

      # TASK-566: EdDSA-sign the stapled DMG and publish a Sparkle appcast so DMG installs
      # auto-update. Must run AFTER stapling — the signature covers the final DMG bytes.
      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          DMG="build/Jobhunt-${TAG}.dmg"

          # Sparkle CLI tools, pinned to the SPM-resolved version (Project.swift: upToNextMajor 2.6.4).
          SPARKLE_VERSION=2.9.3
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools

          # Private signing key from the CI secret → temp file (never echoed). printf avoids a
          # trailing newline that would corrupt the key.
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > sparkle_ed_key
          chmod 600 sparkle_ed_key

          # generate_appcast reads version / shortVersion / minimumSystemVersion from the app inside
          # the DMG, EdDSA-signs the stapled DMG, and emits appcast.xml whose enclosure points at the
          # GitHub release download URL. Only the current DMG is in the dir → single-item appcast.
          mkdir -p build/appcast-src
          cp "$DMG" build/appcast-src/
          sparkle-tools/bin/generate_appcast \
            --ed-key-file sparkle_ed_key \
            --download-url-prefix "https://github.com/brooksc/jobhunt/releases/download/${TAG}/" \
            -o build/appcast.xml \
            build/appcast-src/

          rm -f sparkle_ed_key
          echo "--- appcast.xml ---"
          cat build/appcast.xml
          # Sanity: the signature and the correct enclosure URL must be present.
          grep -q 'sparkle:edSignature' build/appcast.xml || { echo "ERROR: appcast missing EdDSA signature"; exit 1; }
          grep -q "releases/download/${TAG}/Jobhunt-${TAG}.dmg" build/appcast.xml \
            || { echo "ERROR: appcast enclosure URL is wrong"; exit 1; }

      # TASK-356: Clean up signing certificate material before upload steps
      - name: Clean up signing certificate
        if: always()
        run: |
          # Remove decoded p12 file and any Sparkle private key from working directory
          rm -f cert.p12 sparkle_ed_key
          # Lock and delete temporary keychain
          security lock-keychain build.keychain 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true
          echo "Signing material cleaned up"

      # Publish only the two assets that matter: the DMG users download, and appcast.xml — the
      # Sparkle auto-update feed the shipped app polls at releases/latest/download/appcast.xml.
      # (Dropped the checksum, provenance, and extension zip to keep the release uncluttered; the
      # extension is published separately to the Chrome Web Store by release-extension.yml.)
      - name: Upload to GitHub Release
        # softprops/action-gh-release@v2
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            build/Jobhunt-${{ github.ref_name }}.dmg
            build/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
