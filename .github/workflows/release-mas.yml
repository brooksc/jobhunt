name: Release MAS

# Test gate (tag release — MAS):
#   CoreTests + ServerTests  — MAS scheme intentionally excludes MCPTests (MCP not shipped in sandbox build)
#   Extension tests: excluded — DMG workflow covers; no extension dependency in MAS flow
#   AppUITests: excluded      — requires a display server; run manually pre-tag
#   LLMEval: excluded         — opt-in only; run locally with a real LLM provider before tagging

on:
  push:
    tags: ['v*']
jobs:
  build-mas:
    runs-on: macos-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import MAS certificates
        run: |
          echo "${{ secrets.MAS_CERT_BASE64 }}" | base64 --decode > mas.p12
          echo "${{ secrets.MAS_INSTALLER_CERT_BASE64 }}" | base64 --decode > installer.p12
          security create-keychain -p "" build.keychain
          security import mas.p12 -k build.keychain -P "${{ secrets.MAS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security import installer.p12 -k build.keychain -P "${{ secrets.MAS_INSTALLER_CERT_PASSWORD }}" -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
      - name: Install Tuist (pinned via .mise.toml)
        run: mise install tuist
      # tuist install is skipped: Tuist.swift declares an empty Config() with no external
      # Swift Package dependencies, so there is nothing to fetch.
      - name: Generate project
        run: tuist generate --no-open
      - name: Run Swift tests (Core + Server)
        run: |
          nice xcodebuild test \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-MAS \
            -configuration Debug-MAS \
            -destination 'platform=macOS' \
            -only-testing CoreTests \
            -only-testing ServerTests \
            CODE_SIGNING_ALLOWED=NO
      - name: Archive (MAS)
        run: |
          nice xcodebuild archive \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-MAS \
            -configuration Release-MAS \
            -archivePath build/Jobhunt-MAS.xcarchive \
            CODE_SIGN_IDENTITY="3rd Party Mac Developer Application" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
      - name: Export .pkg
        run: |
          cat > export-options-mas.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Jobhunt-MAS.xcarchive \
            -exportPath build/export-mas \
            -exportOptionsPlist export-options-mas.plist
      - name: Upload .pkg as artifact
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Jobhunt-MAS-${{ github.ref_name }}.pkg
          path: build/export-mas/*.pkg
          # Manual upload to App Store Connect via Transporter
