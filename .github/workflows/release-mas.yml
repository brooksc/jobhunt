name: Release MAS

on:
  # The pipeline had its first green end-to-end run (run 27917845870, sha 5268fa5): a signed,
  # provisioned App Store installer .pkg was produced and uploaded as an artifact. Tags now build
  # MAS alongside the DMG. NOTE: the .pkg is signed/provisioned but NOT yet Apple-validated — the
  # first upload to App Store Connect is the real acceptance gate. (TASK-566)
  #
  # Delivery to App Store Connect is NEVER automatic — MAS releases are curated by hand. A tag (or a
  # plain manual run) only BUILDS the .pkg artifact. To actually deliver it, run this workflow via
  # workflow_dispatch with `upload_to_app_store_connect: true` — an explicit, per-release confirmation
  # so nothing lands in App Store Connect without a deliberate action (TASK-601).
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_app_store_connect:
        description: 'Deliver the built .pkg to App Store Connect (leave false to only build the artifact)'
        type: boolean
        required: false
        default: false

# TASK-353: least-privilege permissions — job-level write only for the release job
permissions:
  contents: read

jobs:
  build-mas:
    runs-on: macos-latest
    permissions:
      contents: write   # required to upload release artifacts
      id-token: write   # reserved for future OIDC/attestation use
    env:
      # Authenticates mise's GitHub API calls (tool downloads) → 1000/hr instead of the
      # unauthenticated 60/hr per-IP limit, which otherwise fails 'mise install' (matches swift-build.yml).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify version consistency
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"

          # Extract the Tuist .marketingVersion("x.y.z") value — NOT the Info.plist
          # "$(MARKETING_VERSION)" placeholder. Must match version-parity.yml's parser.
          APP_VERSION=$(grep -o '\.marketingVersion("[0-9.]*")' Project.swift | grep -o '"[0-9.]*"' | tr -d '"')
          EXT_VERSION=$(python3 -c "import json,sys; d=json.load(open('extension/manifest.json')); print(d['version'])")

          echo "Tag: $TAG_VERSION, App: $APP_VERSION, Extension: $EXT_VERSION"

          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match app version $APP_VERSION"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$EXT_VERSION" ]; then
            echo "ERROR: Tag $TAG_VERSION doesn't match extension version $EXT_VERSION"
            exit 1
          fi
          echo "All versions match: $TAG_VERSION"

      # TASK-399: use the same pinned toolchain as normal CI (.mise.toml: Tuist 4.196.1)
      # instead of curl-installing latest Tuist. mise install fails the job on error
      # (no `|| true` masking).
      - name: Install mise
        run: |
          curl -fsSL -o /tmp/mise-install.sh https://github.com/jdx/mise/releases/download/v2026.5.3/install.sh
          echo "76168cc525fc3b209638e88b4c6b707420438a6b7cc428bd468ae08afad432c1  /tmp/mise-install.sh" | shasum -a 256 -c -
          MISE_VERSION=v2026.5.3 sh /tmp/mise-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Expose tool shims (tuist) to later steps, not just the mise binary (matches swift-build.yml).
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools (Tuist via .mise.toml)
        run: mise install && mise reshim

      # Install the provisioning profile and read its name BEFORE generation so Project.swift can pin
      # the app target (only) to it. Installing a profile doesn't touch the keychain search list, so
      # this is safe to run before the tests — unlike the cert import below. (TASK-566)
      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$PROFILE_DIR/jobhunt-mas.provisionprofile"
          security cms -D -i "$PROFILE_DIR/jobhunt-mas.provisionprofile" > /tmp/mas-profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/mas-profile.plist)
          echo "MAS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed provisioning profile: $PROFILE_NAME"

      - name: Generate Xcode project
        # TASK-566: TUIST_MAS_ONLY=1 omits Sparkle (package, dependency, Info.plist keys) so the
        # App Store binary never links a third-party updater. See Project.swift `includeSparkle`.
        # TUIST_MAS_PROFILE_NAME pins the app target (only) to that profile + manual signing, so the
        # global archive override doesn't hit frameworks/MCP, which reject a profile.
        run: TUIST_MAS_ONLY=1 TUIST_MAS_PROFILE_NAME="$MAS_PROFILE_NAME" tuist generate --no-open

      - name: Run tests
        # -retry-tests-on-failure tolerates the intermittent ServerTests NWListener flake
        # (localhost connection drops, Code=-1005) that otherwise fails the whole release.
        run: nice xcodebuild test -project Jobhunt.xcodeproj -scheme Jobhunt-MAS -destination 'platform=macOS' -retry-tests-on-failure -test-iterations 3 CODE_SIGNING_ALLOWED=NO

      # Import AFTER tests: `security list-keychains -s build.keychain` replaces the keychain search
      # list, which breaks the SettingsStore Keychain round-trip unit tests if they run afterward.
      # (The provisioning profile was installed earlier — it doesn't touch the keychain.)
      - name: Import MAS cert
        run: |
          # One p12 holds both the "Apple Distribution" (app) and "3rd Party Mac Developer Installer"
          # (pkg) certs, so import it once with both tool authorizations.
          echo "${{ secrets.MAS_CERT_BASE64 }}" | base64 --decode > mas.p12
          security create-keychain -p "" build.keychain
          security import mas.p12 -k build.keychain -P "${{ secrets.MAS_CERT_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain

      # TASK-571 (MAS half): a uint32-safe monotonic build number. The DMG's YYYYMMDDHHMM timestamp
      # exceeds the App Store's CFBundleVersion uint32 limit (4294967295); yymmddHHMM (~2.6e9) fits,
      # and App Store Connect enforces its own monotonicity on top.
      - name: Compute build number
        run: echo "BUILD_NUMBER=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive (MAS)
        run: |
          # Manual signing with the Apple Distribution cert. The provisioning profile is NOT passed
          # here — a global override hits the frameworks + MCP tool, which reject a profile. Instead
          # Project.swift sets PROVISIONING_PROFILE_SPECIFIER on the app target only (via the
          # TUIST_MAS_PROFILE_NAME injected at generate time). CODE_SIGN_IDENTITY is safe globally:
          # frameworks sign with the identity and no profile, exactly like the DMG archive.
          nice xcodebuild archive \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-MAS \
            -configuration Release-MAS \
            -archivePath build/Jobhunt-MAS.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}

      - name: Export .pkg
        run: |
          APP_PATH="build/Jobhunt-MAS.xcarchive/Products/Applications/Jobhunt.app"
          test -d "$APP_PATH" || { echo "ERROR: Jobhunt.app missing from archive"; exit 1; }
          mkdir -p build/export-mas

          # macos-latest's `xcodebuild -exportArchive` can't enumerate distribution methods on this
          # runner ("IDEDistribution: Unknown Distribution Error" → empty allowed-method set, so the
          # 'method' key is rejected whatever its value) — the same flaky IDEDistribution path the DMG
          # release abandoned. The archived app is ALREADY signed with Apple Distribution + the embedded
          # MAS provisioning profile (manual signing in the Archive step), so wrap it directly in an App
          # Store installer with productbuild — the canonical MAS packaging command — instead.
          INSTALLER_ID=$(security find-identity -v build.keychain \
            | grep -o '3rd Party Mac Developer Installer: [^"]*' | head -1)
          [ -z "$INSTALLER_ID" ] && INSTALLER_ID="3rd Party Mac Developer Installer"
          echo "Installer identity: $INSTALLER_ID"

          productbuild --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_ID" \
            build/export-mas/Jobhunt.pkg
          test -f build/export-mas/Jobhunt.pkg || { echo "ERROR: productbuild produced no .pkg"; exit 1; }
          echo "Built $(ls -la build/export-mas/Jobhunt.pkg)"
      - name: Smoke check MAS artifact
        run: |
          # Inspect the archived app — the exact bundle productbuild wrapped into the .pkg.
          APP_PATH="build/Jobhunt-MAS.xcarchive/Products/Applications/Jobhunt.app"
          HELPER="$APP_PATH/Contents/Helpers/jobhunt-mcp"

          # App must exist
          test -d "$APP_PATH" || { echo "ERROR: Jobhunt.app missing from archive"; exit 1; }

          # The signed installer pkg must exist
          test -f build/export-mas/Jobhunt.pkg || { echo "ERROR: Jobhunt.pkg missing"; exit 1; }

          # App Store builds must embed the provisioning profile (proves manual signing took effect)
          test -f "$APP_PATH/Contents/embedded.provisionprofile" \
            || { echo "ERROR: embedded.provisionprofile missing — app not provisioned for App Store"; exit 1; }

          # MAS build must NOT include the MCP helper (not allowed in sandbox)
          if [ -f "$HELPER" ]; then
            echo "ERROR: MCP helper should not be present in MAS build"
            exit 1
          fi

          # TASK-566: MAS build must NOT bundle Sparkle (App Store bans third-party updaters).
          if [ -e "$APP_PATH/Contents/Frameworks/Sparkle.framework" ]; then
            echo "ERROR: Sparkle.framework present in MAS build — TUIST_MAS_ONLY generation failed"
            exit 1
          fi

          # Check sandbox entitlement is present
          ENTITLEMENTS=$(codesign --display --entitlements :- "$APP_PATH" 2>/dev/null || true)
          echo "$ENTITLEMENTS" | grep -q "app-sandbox" || { echo "ERROR: MAS build missing app-sandbox entitlement"; exit 1; }

          # TASK-398: backup + CSV export write to user-chosen paths via NSSavePanel, which needs
          # user-selected read-WRITE. read-only would let those flows fail silently under sandbox.
          echo "$ENTITLEMENTS" | grep -q "files.user-selected.read-write" \
            || { echo "ERROR: MAS build missing files.user-selected.read-write (backup/CSV export would fail)"; exit 1; }
          if echo "$ENTITLEMENTS" | grep -q "files.user-selected.read-only"; then
            echo "ERROR: MAS build has read-only user-selected entitlement; expected read-write"
            exit 1
          fi

          echo "MAS smoke check passed"

      # TASK-601: deliver the validated .pkg to App Store Connect — ONLY on an explicit, confirmed
      # manual run (`workflow_dispatch` with `upload_to_app_store_connect: true`). A tag build, or a
      # dispatch that leaves the box unchecked, just produces the artifact and skips this. This keeps
      # MAS releases curated: nothing reaches App Store Connect without a per-release confirmation.
      # altool uploads the build; Apple processes it (~5-30 min), then it appears in App Store Connect
      # ready to attach to a version and **Submit for Review** (the workflow never submits — that's
      # still done by hand, with the reviewer/testing notes from docs/app-store-metadata.md). Reuses
      # the DMG-notarization Apple ID + app-specific password, so no new secret. Each run stamps a
      # fresh monotonic build number (yymmddHHMM), so re-runs never collide. NOTE: if this Apple ID
      # ever joins more than one team, add `--asc-provider <ProviderShortname>`
      # (find it via `xcrun altool --list-providers -u … -p …`).
      - name: Upload to App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        env:
          ASC_USERNAME: ${{ secrets.APPLE_ID }}
          ASC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          echo "Uploading build/export-mas/Jobhunt.pkg to App Store Connect…"
          xcrun altool --upload-app \
            --type macos \
            --file build/export-mas/Jobhunt.pkg \
            --username "$ASC_USERNAME" \
            --password "$ASC_PASSWORD"
          echo "Uploaded. After Apple finishes processing, attach the build to a version in App Store Connect and Submit for Review."

      # A MAS delivery is a manual dispatch, so — unlike the DMG — it otherwise leaves NO marker in the
      # repo of what actually reached App Store Connect. Without one, "what changed since the last MAS
      # release?" can only be guessed at from surrounding commits. Stamping the tag here, immediately
      # after a successful altool upload, makes the record a byproduct of the delivery rather than a
      # step someone has to remember. Answer the question with:
      #     git describe --tags --match 'mas-v*' --abbrev=0     # last delivered version
      #     git log $(git describe --tags --match 'mas-v*' --abbrev=0)..HEAD --oneline
      # Re-delivering the same marketing version force-moves its tag: the newest build of a version
      # supersedes the earlier one, so the tag always points at what's actually in App Store Connect.
      - name: Tag the delivered build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_app_store_connect }}
        run: |
          VERSION=$(grep -o '\.marketingVersion("[0-9.]*")' Project.swift | grep -o '"[0-9.]*"' | tr -d '"')
          [ -n "$VERSION" ] || { echo "ERROR: could not parse marketingVersion from Project.swift"; exit 1; }
          TAG="mas-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "Delivered to App Store Connect
          marketing version: $VERSION
          build number:      $BUILD_NUMBER
          commit:            ${{ github.sha }}
          run:               ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          NOTE: delivered to App Store Connect, NOT necessarily submitted for review or released.
          Submission is still done by hand in App Store Connect."
          git push -f origin "refs/tags/$TAG"
          echo "Tagged $TAG at ${{ github.sha }}"

      # TASK-356: Clean up signing certificate material
      - name: Clean up signing certificates
        if: always()
        run: |
          rm -f mas.p12
          security lock-keychain build.keychain 2>/dev/null || true
          security delete-keychain build.keychain 2>/dev/null || true
          echo "Signing material cleaned up"
      - name: Upload .pkg as artifact
        # Keep the artifact even if the App Store Connect delivery step failed, so the .pkg is still
        # recoverable for a manual Transporter retry.
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Jobhunt-MAS-${{ github.ref_name }}.pkg
          path: build/export-mas/*.pkg
          if-no-files-found: warn
          # Backup path: download this artifact and upload to App Store Connect via Transporter.
