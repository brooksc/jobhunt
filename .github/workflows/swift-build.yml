name: Swift Build

# macOS runners cost 10x a Linux one, and this is the only macOS job that runs on every push.
# Backlog and documentation commits can't affect the build, so they don't start one — roughly a third
# of pushes here are task-file updates. A code change still always builds.
on:
  push:
    branches: [main, swift-rewrite]
    tags-ignore: ['v*']
    paths-ignore:
      - '.backlog/**'
      - 'docs/**'
      - 'chromestore/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.backlog/**'
      - 'docs/**'
      - 'chromestore/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # mise resolves tool versions via the GitHub API; without auth it hits the 60/hr
    # unauthenticated limit on the shared runner IP and `mise install` fails with 403
    # (Tuist/SwiftLint/SwiftFormat downloads). The auto-provided token raises this to 1000/hr.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # TASK-414: the test tree is canonically lowercase `tests/` (what git tracks). A capital-T
      # `Tests/` glob in Project.swift only resolves on case-insensitive macOS and breaks on a
      # case-sensitive checkout. Fail fast if one is reintroduced.
      - name: Guard against mixed-case test paths
        run: |
          if grep -q '"Tests/' Project.swift; then
            echo "ERROR: Project.swift references capital-T \"Tests/\". The canonical test tree is lowercase \"tests/\"."
            grep -n '"Tests/' Project.swift
            exit 1
          fi
          echo "OK: Project.swift test paths use canonical lowercase tests/"

      # TASK-417: the committed SQLite fixture must match its manifest, so a fixture change can't
      # land without regenerating the manifest (build-fixture-db.sh writes both).
      - name: Verify fixture matches manifest
        run: |
          FIXTURE=tests/fixtures/jobhunt-test.sqlite
          MANIFEST=tests/fixtures/jobhunt-test.manifest.json
          if [ -f "$FIXTURE" ] && [ -f "$MANIFEST" ]; then
            ACTUAL=$(shasum -a 256 "$FIXTURE" | awk '{print $1}')
            EXPECTED=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['sha256'])")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: $FIXTURE sha256 ($ACTUAL) != manifest ($EXPECTED)."
              echo "Re-run ./scripts/build-fixture-db.sh to regenerate both, then commit them together."
              exit 1
            fi
            echo "OK: fixture matches manifest ($ACTUAL)"
          fi

      - name: Install mise
        run: |
          curl -fsSL -o /tmp/mise-install.sh https://github.com/jdx/mise/releases/download/v2026.5.3/install.sh
          echo "76168cc525fc3b209638e88b4c6b707420438a6b7cc428bd468ae08afad432c1  /tmp/mise-install.sh" | shasum -a 256 -c -
          MISE_VERSION=v2026.5.3 sh /tmp/mise-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Expose tool shims (tuist/swiftlint/swiftformat) to later steps, not just the mise binary.
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools (Tuist, SwiftLint, SwiftFormat)
        run: mise install && mise reshim

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build DMG scheme
        run: |
          xcodebuild -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build MAS scheme
        run: |
          xcodebuild -scheme Jobhunt-MAS \
            -configuration Debug-MAS \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      # Fast gate: CoreTests + ServerTests + MCPTests (~30s).
      # AppUITests: run manually or on a scheduled VM lane (requires display server).
      # LLMEval: opt-in only; run with LLM_EVAL=1 locally after setting a provider.
      - name: Run fast tests (Core + Server + MCP)
        run: |
          set -o pipefail
          xcodebuild -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            -only-testing CoreTests \
            -only-testing ServerTests \
            -only-testing MCPTests \
            -enableCodeCoverage YES \
            -resultBundlePath build/FastTests.xcresult \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate (line floor)
        run: ./scripts/check-coverage.sh build/FastTests.xcresult

      - name: Run extension Node tests
        run: npm test --prefix extension

      # SwiftLint --strict: warnings fail the build; tests use a relaxed nested config (TASK-545).
      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat check
        run: swiftformat app core server/swift mcp/swift tests --lint

      # Compiler-warning ratchet (TASK-570): fails when the distinct-warning count grows past the
      # committed baseline. Not a zero-warning gate — SwiftData's own #Predicate/SortDescriptor
      # machinery emits ~49 KeyPath-Sendable warnings under strict concurrency that are Apple's to
      # fix. The runner's Xcode differs from the dev machine's, so DEVELOPER_DIR is left unset here
      # and the script falls back to whatever xcode-select points at.
      - name: Compiler-warning ratchet
        run: DEVELOPER_DIR="$(xcode-select -p)" ./scripts/check-warnings.sh
