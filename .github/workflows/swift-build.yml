name: Swift Build

on:
  push:
    branches: [main, swift-rewrite]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # TASK-414: the test tree is canonically lowercase `tests/` (what git tracks). A capital-T
      # `Tests/` glob in Project.swift only resolves on case-insensitive macOS and breaks on a
      # case-sensitive checkout. Fail fast if one is reintroduced.
      - name: Guard against mixed-case test paths
        run: |
          if grep -q '"Tests/' Project.swift; then
            echo "ERROR: Project.swift references capital-T \"Tests/\". The canonical test tree is lowercase \"tests/\"."
            grep -n '"Tests/' Project.swift
            exit 1
          fi
          echo "OK: Project.swift test paths use canonical lowercase tests/"

      # TASK-417: the committed SQLite fixture must match its manifest, so a fixture change can't
      # land without regenerating the manifest (build-fixture-db.sh writes both).
      - name: Verify fixture matches manifest
        run: |
          FIXTURE=tests/fixtures/jobhunt-test.sqlite
          MANIFEST=tests/fixtures/jobhunt-test.manifest.json
          if [ -f "$FIXTURE" ] && [ -f "$MANIFEST" ]; then
            ACTUAL=$(shasum -a 256 "$FIXTURE" | awk '{print $1}')
            EXPECTED=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['sha256'])")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: $FIXTURE sha256 ($ACTUAL) != manifest ($EXPECTED)."
              echo "Re-run ./scripts/build-fixture-db.sh to regenerate both, then commit them together."
              exit 1
            fi
            echo "OK: fixture matches manifest ($ACTUAL)"
          fi

      - name: Install mise
        run: curl -Ls https://mise.run | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install pinned tools (Tuist, SwiftLint, SwiftFormat)
        run: mise install

      - name: Generate Xcode project
        run: tuist generate --no-open

      - name: Build DMG scheme
        run: |
          xcodebuild -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Build MAS scheme
        run: |
          xcodebuild -scheme Jobhunt-MAS \
            -configuration Debug-MAS \
            -destination 'platform=macOS' \
            build \
            CODE_SIGNING_ALLOWED=NO

      # Fast gate: CoreTests + ServerTests + MCPTests (~30s).
      # AppUITests: run manually or on a scheduled VM lane (requires display server).
      # LLMEval: opt-in only; run with LLM_EVAL=1 locally after setting a provider.
      - name: Run fast tests (Core + Server + MCP)
        run: |
          set -o pipefail
          xcodebuild -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            -only-testing CoreTests \
            -only-testing ServerTests \
            -only-testing MCPTests \
            -enableCodeCoverage YES \
            -resultBundlePath build/FastTests.xcresult \
            test \
            CODE_SIGNING_ALLOWED=NO

      - name: Coverage gate (line floor)
        run: ./scripts/check-coverage.sh build/FastTests.xcresult

      - name: Run extension Node tests
        run: npm test --prefix extension

      # Non-strict pending TASK-545: pre-existing length/complexity violations report as warnings
      # rather than failing the build. Restore `--strict` once TASK-545 clears them.
      - name: SwiftLint
        run: swiftlint lint

      - name: SwiftFormat check
        run: swiftformat app core server/swift mcp/swift tests --lint
