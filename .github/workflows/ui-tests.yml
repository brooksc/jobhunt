name: UI Tests (Scheduled)

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 8am UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: read

jobs:
  ui-tests:
    # This was pinned to `macos-15` for a reproducible OS/Xcode version, which is the better
    # default — a UI-test result you can't reproduce is worth little. It is unpinned because on
    # 2026-09-03 the pinned image could no longer COMPILE the project: the run died with
    # "Testing cancelled because the build failed" while building `core/LLM/Normalization.swift`,
    # and the previous scheduled run had failed the same way. `swift-build.yml` compiles the same
    # commit on `macos-latest` without complaint, so the difference is the image's Xcode.
    #
    # A workflow that cannot build is worth less than one that is only approximately reproducible,
    # so this tracks `macos-latest` until the macos-15 compile failure is understood. The exact
    # compiler diagnostic was not captured — `gh run view --log-failed` reported the failed
    # SwiftCompile task without an `error:` line — so the cause is still unknown, not fixed.
    # Re-pin once it is.
    runs-on: macos-latest
    # mise resolves tool versions via the GitHub API; without auth it hits the 60/hr
    # unauthenticated limit on the shared runner IP and `mise install` fails with 403
    # (Tuist/SwiftLint/SwiftFormat downloads). The auto-provided token raises this to 1000/hr.
    # Same fix as swift-build.yml — this scheduled job kept failing at setup without it.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      # TASK-406: record the runner's exact macOS + Xcode so it can be compared against the local
      # Tart VM (scripts/run-ui-tests-in-vm.sh prints the same two lines from inside the VM). The
      # macos-15 runner's default Xcode and the digest-pinned VM image's bundled Xcode can drift
      # independently; capturing both makes the divergence explicit and diffable. toolchain.txt is
      # uploaded with the results so the versions for any given run are recoverable later.
      - name: Record toolchain versions (parity vs VM)
        run: |
          mkdir -p build
          {
            echo "── CI toolchain (.github/workflows/ui-tests.yml, runs-on: macos-latest) ──"
            sw_vers
            xcodebuild -version
            echo "xcode-select path: $(xcode-select -p)"
          } | tee build/toolchain.txt

      - name: Install mise
        run: |
          curl -fsSL -o /tmp/mise-install.sh https://github.com/jdx/mise/releases/download/v2026.5.3/install.sh
          echo "76168cc525fc3b209638e88b4c6b707420438a6b7cc428bd468ae08afad432c1  /tmp/mise-install.sh" | shasum -a 256 -c -
          MISE_VERSION=v2026.5.3 sh /tmp/mise-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install pinned tools (Tuist, SwiftLint, SwiftFormat)
        run: mise install && mise reshim

      - name: Generate project
        run: tuist generate --no-open

      # No `continue-on-error`: UI test failures must fail this job so the scheduled run
      # surfaces regressions. The result bundle still uploads via `if: always()` below.
      # `set -o pipefail` keeps xcodebuild's exit status; flaky assertions get up to 3 tries.
      # `| tail -80` used to be the whole story here, and it threw away the one thing worth keeping.
      # The 2026-09-07 scheduled run reported "Executed 42 tests, with 6 failures" and then
      # "Failing tests:" — and the names that follow were exactly the lines tail dropped. A run that
      # fails without saying which test failed costs a full re-run to learn anything, and the
      # .xcresult is 155 MB, which is slow enough to discourage looking.
      #
      # So: keep the full log, print the failure lines specifically, and upload the log alongside the
      # result bundle. `set -o pipefail` + PIPESTATUS keeps xcodebuild's own status authoritative.
      - name: Run AppUITests
        run: |
          set -o pipefail
          mkdir -p build
          set +e
          nice xcodebuild test \
            -project Jobhunt.xcodeproj \
            -scheme Jobhunt-DMG \
            -configuration Debug-DMG \
            -destination 'platform=macOS' \
            -only-testing AppUITests \
            -resultBundlePath build/UITestResults.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/uitests.log | tail -80
          status=${PIPESTATUS[0]}
          set -e

          echo
          echo "── Failures (from the full log) ─────────────────────────────────────"
          grep -E "error:|Test Case .* failed|^\s+-\[" build/uitests.log | sort -u | head -40 \
            || echo "  none recorded"
          # DIAG lines are deliberate diagnostics printed from a test. They land mid-run, so the
          # tail above drops them — the same truncation that hid the failing test names, one level
          # up. Surfaced here so a diagnostic run is actually readable without the 155 MB artifact.
          if grep -q "^DIAG" build/uitests.log; then
            echo "── Diagnostics ─────────────────────────────────────────────────────"
            grep "^DIAG" build/uitests.log | sort -u | head -30
          fi
          echo "── Summary ─────────────────────────────────────────────────────────"
          grep -E "Executed [0-9]+ test" build/uitests.log | tail -3 || true

          exit "$status"

      - name: Upload test results
        if: always()
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-test-results
          path: |
            build/UITestResults.xcresult
            build/toolchain.txt
            build/uitests.log
          retention-days: 7
