# gitleaks config — extends the built-in rules. Run: gitleaks detect --no-banner --redact
[extend]
useDefault = true

[allowlist]
description = "Non-secret test/mock/fixture material and generated dirs"
paths = [
  '''tests/Support/MockLLM/.*''',
  # Backlog task files are prose. The generic-api-key rule fires on high-entropy-looking phrases in
  # acceptance criteria — the first hit was the sentence "A gh_jid job can be refreshed from the
  # Greenhouse API". Nothing here is ever a credential: these files are plans and notes, written by
  # hand and reviewed in the diff like any other text.
  '''\.backlog/.*''',
  '''.*\.xcresult/.*''',
  '''DerivedData/.*''',
  '''Derived/.*''',
]
# The MCP token in docs/tests is a transient local-loopback token, not a real secret.
regexes = [
  '''mock-(model|token|key)''',
  '''sk-test''',
  '''127\.0\.0\.1''',
  # Sparkle EdDSA PUBLIC key (SUPublicEDKey, Project.swift) — public by design: it ships in the app
  # Info.plist to verify update signatures. The private half lives only in a CI secret (TASK-566).
  '''M\+FYCXWxrdmjRzphUpv5wZMxaDh/ecJU22324\+3o4zQ=''',
  # Chrome extension PUBLIC key (extension/manifest.json "key") — public by design: it pins the
  # unpacked extension's id so a release build can be dogfooded with the locally-loaded extension.
  # The Web Store publishes this key, and it's stripped from the uploaded zip (package-extension.sh).
  '''vkl/1pnj2/gBXaeQnxaLq6096tz6P6coEAC''',
  # PostHog project token (marketing/analytics.js) — public by design: a write-only client token
  # meant to be embedded in browser-shipped code, like a Sentry DSN or a GA tracking ID.
  '''phc_qNZcpeGwgfKCViFpw3iQyqfuXMuPDPHGKBNLMC9dDf8S''',
  # Swift identifiers containing "LinkedIn", not LinkedIn credentials. The built-in
  # `linkedin-client-secret` rule looks for the vendor's name near an assignment of a 16-ish
  # character value, which is exactly the shape of an ordinary initializer:
  #
  #     self.deferredLinkedIn = deferredLinkedIn        (AvailabilityChecker.RunSummary)
  #
  # That one line failed gitleaks on EVERY push from 2026-08-21, and a check that is always red
  # stops being read — which is worse than not running it.
  #
  # Matched against the *secret* gitleaks extracted, which is the bare identifier
  # `deferredLinkedIn` — 16 letters, hence the collision with the rule's length expectation. The
  # pattern is anchored and letters-only, so it excuses a camelCase Swift identifier and nothing
  # else: a real client secret drawn from a mixed alphanumeric charset still trips the rule.
  '''^[A-Za-z]*[Ll]inked[Ii]n[A-Za-z]*$''',
]
