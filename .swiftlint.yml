included:
  - app
  - core
  - server/swift
  - mcp/swift
  - Tests

excluded:
  - Tuist
  - DerivedData

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - sorted_imports

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000
