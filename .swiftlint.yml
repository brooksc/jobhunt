included:
  - app
  - core
  - server/swift
  - mcp/swift
  - Tests

excluded:
  - Tuist
  - DerivedData

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - sorted_imports
  # File-level disables are acceptable for the few large cohesive files (TASK-545).
  - blanket_disable_command
  # Low-value structural heuristics: a 6–8 field data-ingest signature, a 3-member tuple, or a
  # nested helper type is often clearer than the struct/refactor these would force (TASK-545).
  - function_parameter_count
  - large_tuple
  - nesting

identifier_name:
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 500
  error: 1000

file_length:
  warning: 800
  error: 1500

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 20
  error: 30
