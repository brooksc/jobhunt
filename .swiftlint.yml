included:
  - app
  - core
  - server/swift
  - mcp/swift
  - Tests

excluded:
  - Tuist
  - DerivedData

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_closing_braces

disabled_rules:
  - trailing_whitespace
  - sorted_imports

identifier_name:
  min_length:
    warning: 1
    error: 1

# NOTE (TASK-545, temporary): the *error* thresholds below are raised above the current worst
# offenders so the pre-existing length/complexity violations report as warnings (still visible in
# `swiftlint lint`) instead of failing CI. The CI step also runs non-strict for the same reason.
# Warning thresholds are unchanged — the violations stay visible. TASK-545 fixes them and restores
# strict thresholds + `--strict`.
line_length:
  warning: 120
  error: 400
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 1500

file_length:
  warning: 500
  error: 2500

function_body_length:
  warning: 40
  error: 150

cyclomatic_complexity:
  warning: 10
  error: 40
